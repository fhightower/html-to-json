[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "html_to_json"
version = "2.0.0"
description = "Convert html to json."
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.10"
authors = [{ name = "Floyd Hightower" }]
keywords = ["html to json", "html", "json", "conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["beautifulsoup4==4.14.3"]

[project.urls]
Homepage = "https://github.com/fhightower/html-to-json"
Documentation = "https://github.com/fhightower/html-to-json"
Source = "https://github.com/fhightower/html-to-json"
Tracker = "https://github.com/fhightower/html-to-json/issues"
PyPI = "https://pypi.org/project/html-to-json/"
Changelog = "https://github.com/fhightower/html-to-json/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ipython==8.*; python_version < '3.11'",
    "ipython==9.*; python_version >= '3.11'",
    "mypy==2.*",
    "pytest==9.*",
    "pytest-cov==7.*",
    "pytest-benchmark==5.*",
    "ruff==0.*",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v --cov=. --cov-report term-missing --cov-fail-under 90"
python_files = "tests/test_*.py"
